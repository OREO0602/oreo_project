<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./i-phone1415-pro-max8.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap"
    />
  </head>
  <body>
    <div class="iphone-14-15-pro-max-8">
      <img
        class="formkitarrowleft-icon3"
        loading="lazy"
        alt=""
        src="./formkitarrowleft.svg"
        id="formkitarrowleftIcon"
      />

      <section class="content">
        <div class="emotion-area-parent">
          <div class="emotion-area">
            <img
              class="tdesignemo-emotional-icon1"
              loading="lazy"
              alt=""
              src="./tdesignemoemotional1.svg"
            />
          </div>
         

          <textarea
  class="mood-input-inner"
  placeholder="Please enter your mood..."
  rows="8"
  cols="20"
></textarea>
          <div class="generation">
            <div class="generator">
              <button class="generator-child" id="rectangleButton"></button>
              <h1 class="generate-content" id="generateContentText">
                Generate Content
              </h1>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      var formkitarrowleftIcon = document.getElementById("formkitarrowleftIcon");
      if (formkitarrowleftIcon) {
        formkitarrowleftIcon.addEventListener("click", function (e) {
          window.location.href = "./i-phone1415-pro-max2.html";
        });
      }
      
      var rectangleButton = document.getElementById("rectangleButton");
      if (rectangleButton) {
        rectangleButton.addEventListener("click", function (e) {
          window.location.href = "./i-phone1415-pro-max11.html";
        });
      }
      
      var generateContentText = document.getElementById("generateContentText");
     

     generateContentText.addEventListener("click", function (e) {
  window.location.href = "./i-phone1415-pro-max11.html?mood=peace";
});
      </script>
  </body>
</html>
