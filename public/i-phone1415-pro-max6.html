<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./i-phone1415-pro-max6.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap"
    />
  </head>
  <body>
    <div class="iphone-14-15-pro-max-6">
      <section class="frame-parent3">
        <div class="frame-wrapper2">
          <div class="vector-container">
            <img
              class="vector-icon4"
              alt=""
              src="./vector3.svg"

            <img

        <div class="sleepwhisper1">SleepWhisper</div>

      <section class="icbaseline-cloud">

    <script>
      var vector = document.getElementById("vector");
      if (vector) {
        vector.addEventListener("click", function (e) {
          window.location.href = "./index.html";
        });
      }
      </script>
