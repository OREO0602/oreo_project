<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./index.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap"
    />
  </head>
  <body>
    <div class="iphone-14-15-pro-max-1">
      <section class="frame-parent">
        <div class="frame-wrapper">
          <div class="vector-parent">
            <img class="vector-icon" alt="" src="./vector@2x.png" />

            <img
              class="vector-icon1"
              loading="lazy"
              alt=""
              src="./vector-1@2x.png"
            />
          </div>
        </div>
        <div class="frame-group">
          <div class="sleepwhisper-wrapper">
            <h3 class="sleepwhisper">SleepWhisper</h3>
          </div>
          <div class="good-evening-are-container">
            <p class="good-evening">Good evening,</p>
            <p class="are-you-ready">are you ready to relax?</p>
          </div>
        </div>
      </section>
      <img class="vector-icon2" alt="" src="./vector1@2x.png" />

      <section class="iphone-14-15-pro-max-1-inner">
        <div class="rectangle-parent">
          <div class="frame-child" id="rectangle"></div>
          <h1 class="start" id="sTARTText">START</h1>
        </div>
      </section>
    </div>

    <script>
      var rectangle = document.getElementById("rectangle");
      if (rectangle) {
        rectangle.addEventListener("click", function (e) {
          window.location.href = "./i-phone1415-pro-max4.html";
        });
      }
      
      var sTARTText = document.getElementById("sTARTText");
      if (sTARTText) {
        sTARTText.addEventListener("click", function (e) {
          window.location.href = "./i-phone1415-pro-max4.html";
        });
      }
      </script>
  </body>
</html>
