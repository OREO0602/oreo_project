<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./i-phone1415-pro-max4.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap"
    />
  </head>
  <body>
    <div class="iphone-14-15-pro-max-4">
      <div class="iphone-pro-max">
        <img
          class="formkitarrowleft-icon"
          loading="lazy"
          alt=""
          src="./formkitarrowleft.svg"
          id="formkitarrowleftIcon"
        />
      </div>
      <section class="frame-container">
        <section class="frame-section">
          <div class="vector-group">
            <img class="vector-icon3" alt="" src="./vector3.svg" />

            <img
              class="wistars-icon"
              loading="lazy"
              alt=""
              src="./wistars.svg"
            />
          </div>
        </section>
        <section class="frame-parent1">
          <div class="welcome-to-sleepwhisper-wrapper">
            <h1 class="welcome-to-sleepwhisper">Welcome to SleepWhisper</h1>
          </div>
          <div class="frame-div">
            <div class="frame-parent2">
              <div class="please-choose-wrapper">
                <h2 class="welcome-to-sleepwhisper">Please choose</h2>
              </div>
              <div class="table-row-cells">
                <button
                  class="table-row-cells-child"
                  id="rectangleButton"
                ></button>
                <h2 class="start-to-relax" id="startToRelax">Start to Relax</h2>
              </div>
            </div>
          </div>
          <div class="frame-wrapper1">
            <div class="rating-button-parent">
              <button class="table-row-cells-child" id="ratingButton"></button>
              <h2 class="rating-analysis" id="ratingAnalysisText">
                Rating Analysis
              </h2>
            </div>
          </div>
        </section>
      </section>
    </div>

    <script>
      var formkitarrowleftIcon = document.getElementById("formkitarrowleftIcon");
      if (formkitarrowleftIcon) {
        formkitarrowleftIcon.addEventListener("click", function (e) {
          window.location.href = "./index.html";
        });
      }
      
      var rectangleButton = document.getElementById("rectangleButton");
      if (rectangleButton) {
        rectangleButton.addEventListener("click", function (e) {
          window.location.href = "./i-phone1415-pro-max2.html";
        });
      }
      
      var startToRelax = document.getElementById("startToRelax");
      if (startToRelax) {
        startToRelax.addEventListener("click", function (e) {
          window.location.href = "./i-phone1415-pro-max2.html";
        });
      }
      
      var ratingButton = document.getElementById("ratingButton");
      if (ratingButton) {
        ratingButton.addEventListener("click", function (e) {
          window.location.href = "./i-phone1415-pro-max5.html";
        });
      }
      
      var ratingAnalysisText = document.getElementById("ratingAnalysisText");
      if (ratingAnalysisText) {
        ratingAnalysisText.addEventListener("click", function (e) {
          window.location.href = "./i-phone1415-pro-max5.html";
        });
      }
      </script>
  </body>
</html>
