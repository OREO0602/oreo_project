<script>
  
  function getMoodFromURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get("mood");
  }


  async function fetchGPTResponse(mood) {
    const output = document.getElementById("gpt-output");
    if (!output) return;

    output.innerText = "Generating...";

    try {
      const res = await fetch("/api/gpt", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
        
          userInput: `I'm feeling very ${mood}. Please comfort me gently in English, preferably in the form of a short story.`
        })
      });

      const data = await res.json();
      output.innerText = data.reply || "nothing return";
    } catch (error) {
      output.innerText = "error";
      console.error(error);
    }
  }

  
  document.addEventListener("DOMContentLoaded", () => {
    const mood = getMoodFromURL();
    if (mood) {
      fetchGPTResponse(mood);
    } else {
      const output = document.getElementById("gpt-output");
      if (output) output.innerText = "No emotional parameters provided";
    }
  });
</script>
