<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./i-phone1415-pro-max15.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap"
    />
  </head>
  <body>
    <div class="iphone-14-15-pro-max-15">
      <section class="i-phone">
        <div class="i-phone-inner">
          <div class="vector-parent2">
            <img class="vector-icon7" alt="" src="./vector3.svg" />

            <img
              class="wistars-icon3"
              loading="lazy"
              alt=""
              src="./wistars.svg"
            />
          </div>
        </div>
        <div class="rectangle-parent5">
          <div class="frame-child4"></div>
          <div class="what-we-need">What we need to improve ..</div>
        </div>
      </section>
      <div class="iphone-14-15-pro-max-15-inner">
        <div class="rectangle-parent6">
          <div class="frame-child5" id="rectangle"></div>
          <h1 class="next" id="nEXTText">NEXT</h1>
        </div>
      </div>
    </div>

    <script>
      var rectangle = document.getElementById("rectangle");
      if (rectangle) {
        rectangle.addEventListener("click", function (e) {
          window.location.href = "./i-phone1415-pro-max16.html";
        });
      }
      
      var nEXTText = document.getElementById("nEXTText");
      if (nEXTText) {
        nEXTText.addEventListener("click", function (e) {
          window.location.href = "./i-phone1415-pro-max16.html";
        });
      }
      </script>
  </body>
</html>
