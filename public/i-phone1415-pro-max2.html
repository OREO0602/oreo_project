<script>

  document.addEventListener('DOMContentLoaded', () => {
    const buttons = document.querySelectorAll('.emotion-btn'); 
    const outputArea = document.getElementById('gpt-output'); 

    buttons.forEach(button => {
      button.addEventListener('click', async () => {
        const emotion = button.innerText; 

        outputArea.innerText = 'Generating...';

        try {
          const res = await fetch('/api/gpt', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
             
              userInput: `My current mood is: ${emotion}. Please comfort me gently in English, preferably with a story.`
            })
          });

          const data = await res.json();
          outputArea.innerText = data.reply || 'nothing return';
        } catch (err) {
          outputArea.innerText = 'error';
          console.error(err);
        }
      });
    });
  });
</script>
